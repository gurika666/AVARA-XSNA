<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xsna</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000fff;
  transition: background 3.5s ease-in-out;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

body.playing {
  background: #000000;
}

.vignette {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100svh;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 0%,
    transparent 50%,
    rgba(0, 0, 0, 0.3) 100%,
    rgba(0, 0, 0, 0.7) 100%
  );
}

.scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100svh;
  z-index: 4;
  pointer-events: none;
  opacity: 1;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.1),
    rgb(255, 255, 255) 1px,
    transparent 10px,
    transparent 10px
  );
  mix-blend-mode: overlay;
  animation: scanlines-move 2s linear infinite;
}

.rive {
  position: fixed;
  display: block;
  width: 100vw;
  height: 100svh;
  z-index: 2;
  cursor: pointer;
  filter:
    drop-shadow(2px 0 0 rgba(255, 0, 0, 0.5))
    drop-shadow(-2px 0 0 rgba(0, 255, 255, 0.5));
}

.main-animation {
  position: fixed;
  display: block;
  top: 0;
  left: 0;
  width: 100vw;
  height: 120svh;
  pointer-events: none;
}



@keyframes scanlines-move {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: 0 500px;
  }
}
</style>
</head>
<body>
<canvas class="main-animation"></canvas>
<canvas class="rive"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<script>
// Listen for the custom event from your app.js that signals animation state changes
window.addEventListener('animationStateChange', function(event) {
  const body = document.body;
  
  if (event.detail && event.detail.isPlaying) {
    body.classList.add('playing');
    console.log('Animation started - background changed to black');
  } else {
    body.classList.remove('playing');
    console.log('Animation stopped - background changed to blue');
  }
});


</script>
</body>
</html>
