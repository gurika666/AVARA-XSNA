<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xsna</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000000;
}

.main-animation {
  position: fixed;
  display: block;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
}

.rive {
  position: fixed;
  display: block;
  width: 100vw;
  height: 100vh;
  z-index: 2;
  filter: 
    drop-shadow(2px 0 0 rgba(255, 0, 0, 0.5))
    drop-shadow(-2px 0 0 rgba(0, 255, 255, 0.5));
}

.vignette {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    transparent 0%,
    transparent 50%,
    rgba(0, 0, 0, 0.3) 100%,
    rgba(0, 0, 0, 0.7) 100%
  );
}

.scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 4;
  pointer-events: none;
  opacity: 1;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.1),
    rgb(255, 255, 255) 1px,
    transparent 10px,
    transparent 10px
  );
  mix-blend-mode: overlay;
  animation: scanlines-move 2s linear infinite;
}

@keyframes scanlines-move {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: 0 500px;
  }
}
</style>
</head>
<body>
<canvas class="main-animation"></canvas>
<canvas class="rive"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>
<script>
</script>
</body>
</html>
